{# Lottie (iconos decorativos): se carga tras el evento load para no competir con el LCP. Versión fija, no @latest. #}
<script>
    window.addEventListener('load', function () {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/@lottiefiles/lottie-player@2.0.12/dist/lottie-player.js';
        document.head.appendChild(s);
    });
</script>
